name: Fund NAV Series Daily

# 每个交易日把东财开放式净值全表写入 fund_nav_series，并按表重算 1/3 年回撤与夏普。
#
# 为什么必须是定时任务：日更不能等用户点一次荐基才拉。目录刷新 sidecar
# 只是顺手触发；worker 循环保证进程在线时每天至少一次。本 workflow 是
# 收盘后的强制补跑，避免当天没人点荐基、或 worker 刚重启漏掉。
#
# 22:10（Asia/Shanghai）：避开 21:40 的规模档案刷新，以及 19:10 / 20:30
# 的方向捕获和 Factor IC。净值此时更可能已结算。
#
# 3 年历史只能逐只回填，耗时长，不放进本 workflow；由 worker 断点续跑，
# 或在容器里手动 `python scripts/sync_fund_nav_series.py --backfill`。
# 节假日若落在周一到周五，当晚这次运行会用当时能读到的东财截面重写。
on:
  schedule:
    - cron: "10 22 * * 1-5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund-nav-series-daily-production
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.LIGHTHOUSE_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Configure Lighthouse SSH identity
        env:
          LIGHTHOUSE_HOST: ${{ secrets.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_USER: ${{ secrets.LIGHTHOUSE_USER }}
          LIGHTHOUSE_SSH_PRIVATE_KEY: ${{ secrets.LIGHTHOUSE_SSH_PRIVATE_KEY }}
          LIGHTHOUSE_KNOWN_HOSTS: ${{ secrets.LIGHTHOUSE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SSH_KEY_PATH=$RUNNER_TEMP/fundpilot-nav-series-key
          SSH_KNOWN_HOSTS_PATH=$RUNNER_TEMP/fundpilot-nav-series-known-hosts
          printf 'SSH_KEY_PATH=%s\nSSH_KNOWN_HOSTS_PATH=%s\n' \
            "$SSH_KEY_PATH" "$SSH_KNOWN_HOSTS_PATH" >> "$GITHUB_ENV"
          [[ -n "$LIGHTHOUSE_HOST" ]] || { echo "::error::LIGHTHOUSE_HOST is empty"; exit 1; }
          [[ -n "$LIGHTHOUSE_USER" ]] || { echo "::error::LIGHTHOUSE_USER is empty"; exit 1; }
          [[ -n "$LIGHTHOUSE_SSH_PRIVATE_KEY" ]] || { echo "::error::LIGHTHOUSE_SSH_PRIVATE_KEY is empty"; exit 1; }
          [[ -n "$LIGHTHOUSE_KNOWN_HOSTS" ]] || { echo "::error::LIGHTHOUSE_KNOWN_HOSTS is empty"; exit 1; }
          printf '%s\n' "$LIGHTHOUSE_SSH_PRIVATE_KEY" | tr -d '\r' > "$SSH_KEY_PATH"
          printf '%s\n' "$LIGHTHOUSE_KNOWN_HOSTS" | tr -d '\r' > "$SSH_KNOWN_HOSTS_PATH"
          chmod 600 "$SSH_KEY_PATH" "$SSH_KNOWN_HOSTS_PATH"
          ssh-keygen -y -f "$SSH_KEY_PATH" >/dev/null

      - name: Sync daily fund NAV series and recompute risk
        id: refresh
        env:
          LIGHTHOUSE_HOST: ${{ secrets.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_USER: ${{ secrets.LIGHTHOUSE_USER }}
        run: |
          set -euo pipefail
          target="${LIGHTHOUSE_USER}@${LIGHTHOUSE_HOST}"
          ssh_options=(-i "$SSH_KEY_PATH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH")
          ssh "${ssh_options[@]}" "$target" \
            "cd /srv/fundpilot/repo && docker compose --env-file .env.production -f docker-compose.production.yml exec -T api python scripts/sync_fund_nav_series.py --daily"

      - name: Record refresh contract
        if: always()
        run: |
          echo "Refresh step outcome: ${{ steps.refresh.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "口径：东财开放式净值全表写入最近 1～2 个披露日到 fund_nav_series。" >> "$GITHUB_STEP_SUMMARY"
          echo "口径：按表重算 1/3 年回撤与夏普到 fund_risk_metrics。" >> "$GITHUB_STEP_SUMMARY"
          echo "口径：3 年历史回填不在本 workflow，由 worker 断点续跑。" >> "$GITHUB_STEP_SUMMARY"
