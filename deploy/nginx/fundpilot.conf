upstream fundpilot_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hllingxi.cn www.hllingxi.cn _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://www.hllingxi.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hllingxi.cn;

    ssl_certificate /etc/letsencrypt/live/hllingxi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hllingxi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FundPilotSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 308 https://www.hllingxi.cn$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name www.hllingxi.cn;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/hllingxi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hllingxi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FundPilotSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # 同时列 application/javascript 与 text/javascript：当前 nginx 1.27.5 的
    # mime.types 把 .js 映射成 application/javascript（已在生产实测确认），但上游
    # 有过改成 text/javascript 的先例。两个都写上，升级 nginx 时不会静默漏压 JS。
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml;
    # 构建期已产出同名 .gz（apps/web/scripts/perf/precompress.mjs，gzip -9），
    # 直接发送预压缩产物：压缩率高于运行时的 level 5，且每请求不再花 CPU 现压。
    # gzip_static 是官方 nginx 镜像固有编入的模块（--with-http_gzip_static_module），
    # 不需要任何额外镜像。放在 server 段而不是 location 段，是为了让自建 brotli 镜像
    # 能在 location 段用 `gzip_static off;` 覆盖它（同一 context 写两次会报 duplicate）。
    gzip_static on;
    etag on;

    # Long-lived event streams need immediate forwarding and a long idle
    # timeout. Keep this policy scoped to the two analysis streams and chat
    # streams; ordinary JSON responses use the buffered location below.
    # gzip / request buffering would hold the first SSE frames and make the
    # browser sit on fetch() until the connect timeout fires.
    # send_timeout / tcp_nodelay: HTTP/2 can stall a large final frame; keep
    # writes moving even when the browser window is 64 KiB.
    location = /api/analyze/stream {
        proxy_pass http://fundpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        tcp_nodelay on;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /api/fund-discovery/stream {
        proxy_pass http://fundpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        tcp_nodelay on;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~ ^/api/(?:fund-discovery/)?reports/[^/]+/chat$ {
        proxy_pass http://fundpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        tcp_nodelay on;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Discovery report bodies are 5–9 MB. The stream now hydrates via this GET
    # instead of stuffing the full payload into one SSE event, so give it more
    # room than ordinary JSON APIs.
    location ~ ^/api/fund-discovery/reports/[^/]+$ {
        proxy_pass http://fundpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Normal JSON APIs benefit from upstream connection reuse, response
    # buffering, gzip and bounded timeouts. Authentication and user-private
    # responses remain uncached.
    location /api/ {
        proxy_pass http://fundpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        access_log off;
        # 预压缩产物由构建期生成（apps/web/scripts/perf/precompress.mjs 同时产出
        # .gz 与 .br）。.gz 由 server 段的 gzip_static 直接消费；启用 brotli_static
        # 的那段配置放在 deploy/nginx/Dockerfile 生成的 /etc/nginx/precompressed/ 里。
        #
        # 这里故意用 glob include：nginx 对匹配不到文件的 glob 不报错，所以同一份
        # 站点配置在「官方 nginx 镜像」和「自建 brotli 镜像」上都能加载 —— 前者发
        # 预压缩 .gz，后者升级为 .br。少了这一层，一旦镜像里没有 brotli 模块，
        # `brotli_static` 就是 unknown directive，nginx 会直接拒绝启动。
        include /etc/nginx/precompressed/*.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Next.js static export emits route.html plus route/ RSC data directories.
    # Serve trailing-slash requests from HTML instead of the index-less data
    # directories, which nginx would otherwise answer with 403.
    location = /login/ {
        try_files /login.html =404;
        include /etc/nginx/precompressed/*.conf;
        expires -1;
    }

    location = /register/ {
        try_files /register.html =404;
        include /etc/nginx/precompressed/*.conf;
        expires -1;
    }

    location = /settings/ {
        try_files /settings.html =404;
        include /etc/nginx/precompressed/*.conf;
        expires -1;
    }

    location = /admin/users/ {
        try_files /admin/users.html =404;
        include /etc/nginx/precompressed/*.conf;
        expires -1;
    }

    location = /reset-password/ {
        try_files /reset-password.html =404;
        include /etc/nginx/precompressed/*.conf;
        expires -1;
    }

    # HTML 文档同样有构建期预压缩产物。官方镜像走 server 段的 gzip_static 发 .gz，
    # 自建 brotli 镜像通过下面的 include 升级为 .br。
    location / {
        try_files $uri.html $uri $uri/ /index.html;
        include /etc/nginx/precompressed/*.conf;
        expires -1;
    }
}
